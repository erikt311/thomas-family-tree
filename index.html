<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Erik S. Thomas — Protected Family Tree</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #93c5fd;
      background: rgba(37, 99, 235, 0.16);
      border: 1px solid rgba(96, 165, 250, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 13px; color: #94a3b8; margin: 0 0 18px; line-height: 1.5; }
    label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      outline: none;
    }
    input[type="password"]:focus { border-color: #3b82f6; }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .err {
      margin-top: 12px;
      font-size: 12px;
      color: #fca5a5;
      min-height: 18px;
    }
    .foot {
      margin-top: 16px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }
    function bytesToB64(u8) {
      let s = '';
      for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
      return btoa(s);
    }

    // Start downloading the (encrypted) photo bundle while the user types the password
    const thumbsPromise = fetch(THUMBS_URL)
      .then(r => { if (!r.ok) throw new Error('photos HTTP ' + r.status); return r.arrayBuffer(); });
    thumbsPromise.catch(() => {});

    document.getElementById('unlockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('unlockBtn');
      const err = document.getElementById('errMsg');
      const pw = document.getElementById('pw').value;
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Decrypting...';
      let key, plainBuf;
      try {
        const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
        key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToBytes(SALT_B64), iterations: ITERATIONS, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          true,
          ['decrypt']
        );
        const data = b64ToBytes(DATA_B64);
        plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
      } catch (ex) {
        err.textContent = 'Incorrect password (or browser WebCrypto unavailable). Please try again.';
        btn.disabled = false;
        btn.textContent = 'Unlock Family Tree';
        return;
      }
      btn.textContent = 'Loading photos...';
      let photosText = '{}';
      try {
        const tb = new Uint8Array(await thumbsPromise);
        const pb = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: tb.slice(16, 28) }, key, tb.slice(28));
        photosText = new TextDecoder().decode(pb);
      } catch (ex) {
        console.warn('Photo bundle could not be loaded; opening without photos.', ex);
      }
      const rawKey = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      let html = new TextDecoder().decode(plainBuf);
      html = html.split('/*__SITE_KEY__*/').join(bytesToB64(rawKey));
      const marker = '/*__PHOTO_BUNDLE__*/{}';
      const at = html.indexOf(marker);
      if (at >= 0) html = html.slice(0, at) + photosText + html.slice(at + marker.length);
      document.open();
      document.write(html);
      document.close();
    });
  </script>
